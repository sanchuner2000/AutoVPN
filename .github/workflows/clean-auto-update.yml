name: Clean Auto Update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *' # UTC22点 = 北京时间06:00

jobs:
  clean-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Clean workflow runs
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: sanchuner2000/AutoVPN
        run: |
          set -e
          clean_workflow() {
            local WORKFLOW_NAME="$1"
            echo "===== 开始清理工作流: $WORKFLOW_NAME ====="
            run_ids=$(gh api -X GET "/repos/${REPO}/actions/workflows/${WORKFLOW_NAME}/runs" -F per_page=100 --jq '.workflow_runs[] | select(.status=="completed") | .id')
            arr=($run_ids)
            count=${#arr[@]}
            echo "找到已完成记录总数: $count"
            if (( count <= 1 )); then
              echo "记录不足2条，无需删除"
              return
            fi
            # 保留最新1条，其余全部删除
            for ((i=1; i<count; i++)); do
              rid=${arr[$i]}
              echo "删除 Run ID: $rid"
              gh api -X DELETE "/repos/${REPO}/actions/runs/$rid" || echo "警告：删除 $rid 失败"
            done
            echo "===== $WORKFLOW_NAME 清理完成 ====="
          }
          # 主工作流真实名称（从api查到：V2Ray Subscription Aggregator）
          clean_workflow "V2Ray Subscription Aggregator"
          # 清理自身 Clean Auto Update
          clean_workflow "Clean Auto Update"
